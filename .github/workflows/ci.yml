name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # egui/eframe system libraries (eframe README) + GTK for native file dialogs (rfd).
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Release build
        run: cargo build --release -p braceray-app

  # The 100 MB fixture set (generator check) and the criterion benches in quick mode.
  # Report only: shared runners are too noisy to gate on; compare with docs/PERF.md by hand.
  fixtures-bench:
    name: fixtures + benches (report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Generate the 100 MB fixture set
        run: cargo run --release -p gen-fixtures -- all --max-size 100m --out fixtures-data

      - name: Benchmarks (quick)
        shell: bash # -o pipefail, so a failing bench fails the step despite `tee`
        run: cargo bench -p braceray-core -- --quick 2>&1 | tee bench.txt

      - name: Bench summary
        run: grep -E "^[a-z_0-9]+/[a-z_0-9]+|time:" bench.txt >> "$GITHUB_STEP_SUMMARY" || true

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
