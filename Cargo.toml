[workspace]
resolver = "3"
members = ["crates/braceray-core", "crates/braceray-app", "tools/fixtures"]
# cargo-fuzz targets need nightly; build them with `cargo +nightly fuzz` from fuzz/.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/MartinHar/braceray"
authors = ["Martin Harutyunyan"]

[workspace.dependencies]
eframe = "0.37.0"
egui_kittest = "0.37.0"
mimalloc = "0.1.52"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
strip = "none"

# Fixture tests generate and parse ~100 MB; keep them fast in debug/test builds.
[profile.dev.package.gen-fixtures]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 3

[profile.dev.package.fastrand]
opt-level = 3
