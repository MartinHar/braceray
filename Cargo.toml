[workspace]
resolver = "3"
members = ["crates/braceray-core", "crates/braceray-app", "tools/fixtures"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/MartinHar/braceray"
authors = ["Martin Harutyunyan"]

[workspace.dependencies]
eframe = "0.37.0"
egui_kittest = "0.37.0"
mimalloc = "0.1.52"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
strip = "none"
