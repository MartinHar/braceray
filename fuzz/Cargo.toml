[package]
name = "braceray-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

# Standalone: not part of the main workspace (needs nightly).
[workspace]
members = ["."]

[dependencies]
braceray-core = { path = "../crates/braceray-core" }
libfuzzer-sys = "0.4.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[[bin]]
name = "index_any_bytes"
path = "fuzz_targets/index_any_bytes.rs"
test = false
doc = false
bench = false


[[bin]]
name = "pretty_range"
path = "fuzz_targets/pretty_range.rs"
test = false
doc = false
bench = false

[[bin]]
name = "search_any"
path = "fuzz_targets/search_any.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
