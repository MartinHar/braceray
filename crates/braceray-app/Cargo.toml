[package]
name = "braceray-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

description = "Read-only desktop viewer for huge JSON files"

[[bin]]
name = "braceray"
path = "src/main.rs"

[features]
# Heap counter for memory measurements (step 12, ADR 027). Off by default; not in releases.
alloc-stats = []

[dependencies]
braceray-core = { version = "0.0.0", path = "../braceray-core" }
eframe.workspace = true
egui_inspection = { version = "0.37.0", features = ["plugin"] }
memory-stats = "1.2.0"
mimalloc.workspace = true
pollster = "1.0.3"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"

[dev-dependencies]
egui_kittest.workspace = true
tempfile = "3.27.0"
