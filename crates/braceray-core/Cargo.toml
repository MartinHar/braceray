[package]
name = "braceray-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

description = "Core engine of Braceray: mmap, structural index, search (no UI)"

[dependencies]
memchr = "2.8.3"
memmap2 = "0.9.12"
thiserror = "2.0.21"
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }

[dev-dependencies]
gen-fixtures = { path = "../../tools/fixtures" }
memory-stats = "1.2.0"
proptest = "1.12.0"
serde = "1.0.229"
serde_json = { version = "1.0.154", features = ["preserve_order", "unbounded_depth"] }
tempfile = "3.27.0"
