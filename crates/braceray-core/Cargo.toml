[package]
name = "braceray-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

description = "Core engine of Braceray: mmap, structural index, search (no UI)"

[lib]
# Only the criterion benches; libtest's bench harness rejects `--quick`.
bench = false

[dependencies]
aho-corasick = "1.1.5"
bytemuck = { version = "1.25.2", features = ["derive"] }
memchr = "2.8.3"
memmap2 = "0.9.12"
rayon = "1.12.0"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }

[dev-dependencies]
criterion = "0.8.2"
gen-fixtures = { path = "../../tools/fixtures" }
memory-stats = "1.2.0"
proptest = "1.12.0"
serde = "1.0.229"
serde_json = { version = "1.0.154", features = ["preserve_order", "unbounded_depth"] }
serde_json_path = "0.7.2"
tempfile = "3.27.0"

[[bench]]
name = "index"
harness = false

[[bench]]
name = "cache"
harness = false

[[bench]]
name = "tree"
harness = false

[[bench]]
name = "pretty"
harness = false

[[bench]]
name = "search"
harness = false

[[bench]]
name = "copy"
harness = false

[target."cfg(unix)".dependencies]
libc = "0.2.191"
